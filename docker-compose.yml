# Base PostgreSQL de développement, port hôte configurable par DB_PORT.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-mediatheque}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API construite depuis le Dockerfile, lancée seulement avec --profile app.
  api:
    profiles: [app]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-mediatheque}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      IA_FOURNISSEUR: ${IA_FOURNISSEUR:-bouchon}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODELE: ${OPENAI_MODELE:-gpt-4.1-mini}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

volumes:
  db-data:
